<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- UTF-8 preserva acentos; viewport permite adaptar o layout à largura do dispositivo. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Metadados, ícone e título identificam o projeto na aba e na busca. -->
    <meta name="theme-color" content="#f8f9fc" />
    <meta name="description" content="Exemplos de React e Vite para consultar: JSON, listas, filtros, formulários e relacionamentos." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>React em consulta | Vite + React</title>
  </head>
  <body>
    <!-- main.jsx encontra este elemento e monta a aplicação React dentro dele. -->
    <div id="root"></div>
    <!-- type="module" habilita os imports; o Vite processa a entrada e os arquivos importados. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
